name: Build and Test
permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches:
      - "**"
      - "!gh-pages"
  pull_request:
    branches:
      - main

jobs:
  clang-format:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    # clang-format reads the repository's .clang-format and reflows to its
    # ColumnLimit. --dry-run discards the output and --Werror makes clang-format
    # exit non-zero if any tracked source file would be changed, so this job
    # fails (rather than silently reformatting) whenever the tree drifts.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install clang-format
        run: |
          dnf -y update
          dnf -y install clang-tools-extra findutils

      # Enumerate sources with find rather than `git ls-files`: actions/checkout
      # downloads the tree as a plain archive inside the container (git is not
      # present at checkout time), so no .git directory exists for git to read.
      # Running from the checkout root makes the repo's .clang-format apply.
      - name: Verify formatting
        run: find . -type f \( -name '*.c' -o -name '*.h' \) -exec clang-format --dry-run --Werror {} +

  build-test:
    runs-on: ubuntu-latest
    # Compile/test will not run until formatting passes.
    needs: clang-format
    container:
      image: fedora:latest

    # Build and test under each supported C compiler. CTest, checksec, and the
    # coverage target in test/CMakeLists.txt already branch on the compiler, so
    # selecting CC here exercises the full pipeline for both toolchains.
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc
          - clang

    env:
      # Forward the chosen compiler to CMake via CC.
      CC: ${{ matrix.compiler }}

    name: Test compile (${{ matrix.compiler }})

    steps:
      - name: Install build dependencies
        run: |
          dnf -y update
          dnf -y install \
            gcc \
            gcc-c++ \
            make \
            cmake \
            libcap-devel \
            libseccomp-devel \
            asciidoc \
            checksec \
            shellcheck \
            bats \
            hostname \
            lcov
          # clang + LLVM coverage tools.
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            dnf -y install clang clang-devel llvm
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure
        run: |
          cmake -B build -S . -Wdev -Wdeprecated \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DUSE_SECCOMP=ON \
            -DUSE_LANDLOCK=ON

      - name: Build
        run: |
          export LDFLAGS="-Wl,--as-needed -Wl,-z,relro -Wl,-z,now -Wl,-z,combreloc"
          cmake --build build --parallel --verbose

      - name: Test
        run: |
          cd build
          ctest --output-on-failure --verbose

      - name: Coverage
        run: make -C build coverage
