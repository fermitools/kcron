name: Build and Test
permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches:
      - "**"
      - "!gh-pages"
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    name: Test compile

    steps:
      - name: Install build dependencies
        run: |
          dnf -y update
          dnf -y install \
            gcc \
            gcc-c++ \
            make \
            cmake \
            libcap-devel \
            libseccomp-devel \
            asciidoc \
            checksec \
            shellcheck \
            bats \
            hostname \
            lcov

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure
        run: |
          cmake -B build -S . -Wdev -Wdeprecated \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DUSE_SECCOMP=ON \
            -DUSE_LANDLOCK=ON

      - name: Build
        run: |
          export LDFLAGS="-Wl,--as-needed -Wl,-z,relro -Wl,-z,now -Wl,-z,combreloc"
          cmake --build build --parallel --verbose

      - name: Test
        run: |
          cd build
          ctest --output-on-failure --verbose

      - name: Coverage
        run: make -C build coverage
